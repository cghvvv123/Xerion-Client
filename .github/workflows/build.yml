name: Build Xerion Jar (JDK 17)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3 # 自动处理 Gradle 缓存

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (Forge)
        run: ./gradlew build -x test --no-daemon

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xerion-Client-jar
          path: forge/build/libs/*.jar # Forge 模组产物通常在 forge 子模块下
